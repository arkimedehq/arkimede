<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notes</title>
  <style>
    :root { color-scheme: light dark; --bg: #fff; --fg: #111827; --muted: #6b7280; --line: #e5e7eb; --accent: #2563eb; }
    :root[data-theme="dark"] { --bg: #030712; --fg: #f3f4f6; --muted: #9ca3af; --line: #1f2937; --accent: #3b82f6; }
    body { margin: 0; padding: 16px; font: 14px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
    form { display: flex; gap: 8px; margin-bottom: 16px; }
    input { flex: 1; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: inherit; }
    button { padding: 8px 14px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
    li { padding: 8px 0; border-bottom: 1px solid var(--line); list-style: none; }
    ul { padding: 0; margin: 0; }
    small { color: var(--muted); }
  </style>
</head>
<body>
  <form id="add"><input id="text" maxlength="500" placeholder="A new note" required><button>Add</button></form>
  <p id="status"><small>Loading…</small></p>
  <ul id="notes"></ul>
  <script src="app.js"></script>
</body>
</html>
